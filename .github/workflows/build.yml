name: Build Droidspaces Kernel (Xiaomi Mi 9 SE / grus)

# 用途:从 crDroid 12 (Android 16) 所用的内核源码出发,注入 Droidspaces 所需的
# non-GKI 内核配置 + 官方补丁,编译出可直接刷入的 AnyKernel3 卡刷包。
#
# 关键前提(已在源码层面核实):
#   * 该内核树全部驱动 =y 编译进内核,defconfig 中 =m 的条目为 0,即不产生 .ko 模块。
#     因此改配置不会引发 CONFIG_MODVERSIONS 的符号 CRC 不匹配,/vendor 不需要跟着换。
#   * 先验证再下结论:本树 defconfig 的 =m 条目同样为 0,不产生 .ko,改配置不会引发
#     模块符号 CRC 不匹配。
#   * 非官方 ROM(带 OTA):刷自定义内核后 OTA 会覆盖 boot,每次 OTA 后需重刷。
#     本流程只替换 boot 里的 kernel,保留 ramdisk / dtb,不动 dtbo 与 recovery。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库 (owner/repo)'
        required: true
        default: 'Rocky7842/android_kernel_xiaomi_sdm710'
      kernel_ref:
        description: '分支名或提交号。必须用 -ksu 分支,否则刷入后丢失 root!'
        required: true
        default: 'lineage-23.2-ksu'
      publish_release:
        description: '构建成功后发布到 Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout(本仓库:工作流 + 配置 + 打包脚本)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex gawk \
            git gnupg gperf imagemagick kmod libelf-dev libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi

      - name: 获取内核源码
        run: |
          set -eux
          REPO="${{ inputs.kernel_repo }}"
          REF="${{ inputs.kernel_ref }}"
          SHA_SHORT="$REF"

          # 分支名 -> 浅克隆(快)
          # 其他(提交 SHA / tag)-> codeload tarball
          #   Rocky 的内核分支会被 rebase/force-push,设备上跑的那个提交往往已经不是
          #   任何分支的祖先,此时 git fetch <sha> 会报 "couldn't find remote ref",
          #   但 codeload 仍能按 SHA 打包,所以走 tarball。
          if git ls-remote --exit-code --heads "https://github.com/${REPO}.git" "$REF" >/dev/null 2>&1; then
            echo "==> '$REF' 是分支,浅克隆"
            git clone --depth 1 --branch "$REF" "https://github.com/${REPO}.git" kernel
            SHA_SHORT=$(git -C kernel rev-parse --short=12 HEAD)
            git -C kernel log --oneline -1
          else
            echo "==> '$REF' 不是分支,按提交 SHA 走 codeload tarball"
            rm -rf kernel
            mkdir -p kernel
            curl -fsSL "https://codeload.github.com/${REPO}/tar.gz/${REF}" \
              | tar -xz --strip-components=1 -C kernel
            test -f kernel/Makefile
            echo "kernel source extracted: $(find kernel -name '*.c' | wc -l) 个 .c 文件"
          fi

          echo "KERNEL_SHA=${SHA_SHORT}" >> "$GITHUB_ENV"
          echo "解析到的内核标识: ${SHA_SHORT}"

      - name: 安装工具链 (ZyCromerZ Clang 16)
        run: |
          set -eux
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          curl -fsSL -o clang.tar.gz \
            "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz"
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          test -x "$HOME/zyc-clang/bin/clang"
          echo "$HOME/zyc-clang/bin" >> "$GITHUB_PATH"

      - name: 工具链自检
        run: |
          set -ux
          export PATH="$HOME/zyc-clang/bin:$PATH"
          missing=0
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  [ OK ] %-16s %s\n' "$t" "$(command -v $t)"
            else
              printf '  [MISS] %-16s 缺失\n' "$t"
              missing=1
            fi
          done
          echo "--- 32 位 ARM 交叉工具链(compat vDSO 必需)---"
          for t in arm-linux-gnueabi-ld arm-linux-gnueabi-gcc arm-linux-gnueabi-as; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  [ OK ] %-24s %s\n' "$t" "$(command -v $t)"
            else
              printf '  [MISS] %-24s 缺失\n' "$t"
              missing=1
            fi
          done
          echo "--- ld.lld 是不是包装脚本 ---"
          file "$(command -v ld.lld 2>/dev/null)" 2>/dev/null || true
          echo "--- 版本 ---"
          clang --version 2>&1 | head -2 || true
          ld.lld --version 2>&1 | head -2 || true
          [ "$missing" -eq 0 ] || { echo "::error::工具链不完整"; exit 1; }

          # 为 32 位 vDSO 准备的 ARM32 GCC 包装脚本随仓库提供(见 scripts/)
          WRAP="$GITHUB_WORKSPACE/scripts/arm32-gcc-wrapper.sh"
          test -f "$WRAP"
          chmod +x "$WRAP"
          echo "ARM32 包装脚本: $WRAP"
          arm-linux-gnueabi-gcc --version | head -1

      - name: 应用 Droidspaces 官方 non-GKI 内核补丁
        run: |
          set -eux
          BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI"
          curl -fsSL -o /tmp/01-xt_qtaguid.patch \
            "$BASE/01.fix_kernel_panic_in_xt_qtaguid.patch"
          curl -fsSL -o /tmp/02-cgroup-prefix.patch \
            "$BASE/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          cd kernel

          # 逐个补丁判断:目标文件不存在 -> 该驱动已从树中移除,补丁不适用,跳过;
          #               可正向应用 -> 应用;
          #               只能反向应用 -> 之前已应用,跳过;
          #               目标存在但推不进去 -> 真失败,中止。
          apply_patch() {
            local p="$1" target
            target=$(grep -m1 '^--- a/' "$p" | sed 's|^--- a/||')
            if [ -z "$target" ]; then
              echo "::error::无法从 $(basename "$p") 解析目标文件"
              return 1
            fi
            if [ ! -e "$target" ]; then
              echo "::warning::跳过 $(basename "$p"):目标 $target 不在该内核树中(该驱动已被移除,补丁不适用)"
              return 0
            fi
            if patch -p1 --dry-run --forward < "$p" > /tmp/patch-dry.log 2>&1; then
              patch -p1 --forward < "$p"
              echo "已应用 $(basename "$p")"
            elif patch -p1 --dry-run --reverse --forward < "$p" > /dev/null 2>&1; then
              echo "已应用过 $(basename "$p"),跳过"
            else
              echo "::error::$(basename "$p") 无法应用(目标 $target 存在但内容不匹配)"
              cat /tmp/patch-dry.log
              return 1
            fi
          }

          apply_patch /tmp/01-xt_qtaguid.patch
          apply_patch /tmp/02-cgroup-prefix.patch
          echo "补丁阶段完成"

      - name: 合并 defconfig 并注入 Droidspaces 配置
        run: |
          set -eux
          cd kernel
          C=arch/arm64/configs
          # device tree 的 TARGET_KERNEL_CONFIG 是"多文件按序拼接",这里等价复现,
          # 最后接上 Droidspaces 片段 —— 顺序在后,可覆盖原有的 "# CONFIG_PID_NS is not set"
          cat "$C/sdm670-perf_defconfig" \
              "$C/xiaomi/sdm710-common.config" \
              "$C/xiaomi/grus.config" \
              "$GITHUB_WORKSPACE/config/grus-droidspaces.config" \
              > "$C/grus_ds_defconfig"
          echo "合并后行数: $(wc -l < "$C/grus_ds_defconfig")"
          echo "其中 CONFIG_ 条目: $(grep -c '^CONFIG_' "$C/grus_ds_defconfig")"

      - name: 生成 .config 并校验关键项
        run: |
          set -euxo pipefail
          cd kernel

          # CC_ARM32:32 位 vDSO 交给真正的 ARM32 GCC。
          # arch/arm64/kernel/vdso32/Makefile 在 cc-name=clang 时会组出
          #   clang --target=arm-linux-gnueabi --gcc-toolchain=... --prefix=...
          # 但 ZyCromerZ 的 clang 包里自带一个宿主 x86_64 的 ld,clang 会优先在
          # 自己所在目录找链接器 -> "unrecognised emulation mode: armelf_linux_eabi"。
          # 命令行变量优先于 Makefile 赋值,因此把 CC_ARM32 指到 ARM32 GCC 包装脚本
          # (包装脚本会自动剥离 clang 专有参数,见"工具链自检"步骤)。
          # 关键:LLVM 工具全部显式写在命令行上。
          # 4.14 的 arch/arm64/Makefile 有 "LD += -EL";靠 LLVM=1 在 Makefile 内赋值时,
          # 递归子 make(vdso)拿到的 LD 会为空 -> 命令变成 "-EL ..." -> 构建失败。
          # 命令行变量通过 MAKEFLAGS 传到每一层子 make,因此不会再出现空值。
          MAKE_OPTS=(-j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64
                     CC="ccache clang" HOSTCC="ccache clang"
                     CLANG_TRIPLE=aarch64-linux-gnu-
                     CROSS_COMPILE=aarch64-linux-gnu-
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi-
                     LLVM=1 LLVM_IAS=1
                     LD=ld.lld AR=llvm-ar NM=llvm-nm
                     CC_ARM32=$GITHUB_WORKSPACE/arm32-gcc-wrapper.sh
                     OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
                     READELF=llvm-readelf STRIP=llvm-strip)

          make "${MAKE_OPTS[@]}" grus_ds_defconfig
          make "${MAKE_OPTS[@]}" olddefconfig

          fail=0

          echo "========== A. 容器启动关键项(必须 =y) =========="
          for s in NAMESPACES UTS_NS PID_NS IPC_NS SYSVIPC POSIX_MQUEUE \
                   SECCOMP SECCOMP_FILTER CGROUPS DEVTMPFS NET_NS; do
            if grep -qx "CONFIG_${s}=y" out/.config; then
              echo "  [ OK ] CONFIG_${s}=y"
            else
              echo "  [FAIL] CONFIG_${s} 不是 =y"
              fail=1
            fi
          done

          # 收集本内核树真正定义的符号,避免把"树里没这个符号"误报成"未启用"
          grep -rhoE '^config [A-Z0-9_]+' --include='Kconfig*' . 2>/dev/null \
            | awk '{print $2}' | sort -u > /tmp/known-symbols.txt || true
          echo "本内核树定义 $(wc -l < /tmp/known-symbols.txt) 个配置符号"

          echo "========== B. 功能性配置(缺失不阻断启动) =========="
          for s in CGROUP_DEVICE CGROUP_SCHED FAIR_GROUP_SCHED CGROUP_FREEZER \
                   CGROUP_NET_PRIO MEMCG CGROUP_CPUACCT CGROUP_PIDS USER_NS \
                   BLK_DEV_LOOP EXT4_FS OVERLAY_FS TMPFS_XATTR TMPFS_POSIX_ACL \
                   VETH BRIDGE NETFILTER BRIDGE_NETFILTER NF_CONNTRACK \
                   IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES \
                   IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS \
                   NETFILTER_XT_MATCH_ADDRTYPE NF_NAT_REDIRECT \
                   IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES FUSE_FS TUN MACVLAN; do
            if grep -qx "CONFIG_${s}=y" out/.config; then
              echo "  [ OK ] CONFIG_${s}=y"
            elif ! grep -qx "${s}" /tmp/known-symbols.txt; then
              echo "  [N/A ] CONFIG_${s} —— 本内核树无此符号"
            else
              echo "  [ -- ] CONFIG_${s} 未启用"
            fi
          done

          echo "========== C. 必须关闭的项 =========="
          for s in ANDROID_PARANOID_NETWORK PERF_HUMANTASK; do
            if grep -qx "CONFIG_${s}=y" out/.config; then
              echo "  [FAIL] CONFIG_${s}=y 必须关闭"
              fail=1
            else
              echo "  [ OK ] ${s} 已关闭"
            fi
          done

          echo "========== D. KernelSU(保住 root) =========="
          if [ -f drivers/kernelsu/Kconfig ]; then
            if grep -qx "CONFIG_KSU=y" out/.config; then
              echo "  [ OK ] CONFIG_KSU=y —— 刷入后 KernelSU root 保留"
            else
              echo "  [FAIL] 该分支带 KernelSU 源码,但 CONFIG_KSU 未启用"
              fail=1
            fi
          else
            echo "  [WARN] 该分支不含 drivers/kernelsu —— 刷入后会丢失 root!"
            echo "         请把 kernel_ref 改成 lineage-23.2-ksu 重新构建。"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::关键内核配置未生效,已中止(避免刷入一个起不了容器的内核)"
            exit 1
          fi
          echo "全部关键配置校验通过 ✅"

      - name: 编译内核
        run: |
          set -eux
          cd kernel
          make -j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache clang" HOSTCC="ccache clang" \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 LLVM_IAS=1 \
               LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
               READELF=llvm-readelf STRIP=llvm-strip \
               CC_ARM32=$GITHUB_WORKSPACE/arm32-gcc-wrapper.sh
          # grus 的 BOARD_KERNEL_IMAGE_NAME 是 Image.gz(KERNEL_GZIP 默认 y)
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz 2>/dev/null || true
          file out/arch/arm64/boot/Image* 2>/dev/null || true

      - name: 打包 AnyKernel3 卡刷包
        run: |
          set -eux
          # 固定到已验证的 AnyKernel3 提交
          AK3_SHA=020dfeccf9d7e962a48400fc94d3e451df92eead
          mkdir -p ak3
          curl -fsSL "https://github.com/osm0sis/AnyKernel3/archive/${AK3_SHA}.tar.gz" \
            | tar -xz --strip-components=1 -C ak3
          # 覆盖为本机型的 anykernel.sh
          cp anykernel/anykernel.sh ak3/anykernel.sh
          # 注意:这里故意【不放 dtb】—— 保留 ROM 原有 dtb/dtbo,只替换 boot 里的 kernel
          # 优先 Image(与本机型 BOARD_KERNEL_IMAGE_NAME 一致),回退 Image.gz
          KIMG=""
          for c in Image Image.gz; do
            if [ -f "kernel/out/arch/arm64/boot/$c" ]; then
              cp "kernel/out/arch/arm64/boot/$c" "ak3/$c"
              KIMG="$c"
              break
            fi
          done
          if [ -z "$KIMG" ]; then
            echo "::error::out/arch/arm64/boot 下既没有 Image 也没有 Image.gz"
            ls -la kernel/out/arch/arm64/boot/ || true
            exit 1
          fi
          echo "打入卡刷包的内核镜像: $KIMG"
          ls -la "ak3/$KIMG"
          ZIP="Droidspaces-grus-${KERNEL_SHA}.zip"
          ( cd ak3 && zip -r9 "../${ZIP}" . -x '*.git*' > /dev/null )
          rm -rf kernel
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Droidspaces-grus-${{ env.KERNEL_SHA }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidspaces-grus-${{ env.KERNEL_SHA }}-${{ github.run_number }}
          name: "Droidspaces kernel for Xiaomi Mi 9 SE (grus) — ${{ env.KERNEL_SHA }}"
          body: |
            Droidspaces-enabled kernel for **Xiaomi Mi 9 SE (grus)**, crDroid 12 / Android 16.

            - Kernel source: `${{ inputs.kernel_repo }}` @ `${{ inputs.kernel_ref }}`
            - Resolved commit: `${{ env.KERNEL_SHA }}`
            - Includes Droidspaces non-GKI config + official kernel patches
            - Replaces the **kernel in the boot image only**; keeps your ROM's dtb, dtbo and vendor_boot
            - Flash with any AnyKernel3-compatible flasher (e.g. KernelFlasher) while rooted
          files: ${{ env.ZIP }}
          draft: false
          prerelease: false
